<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ping Pong Street - Stable</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Titan+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFDE59; --text: #1a1a1a; --panel: #FFFFFF;
    --primary: #FF5757; --secondary: #5271FF; --accent: #38B6FF;
    --green: #00C878; --purple: #9B59B6;
    --border: 4px solid #1a1a1a; --shadow: 6px 6px 0px #1a1a1a; --shadow-sm: 4px 4px 0px #1a1a1a;
  }
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
  html, body { 
    height: 100%; overflow: hidden; background: var(--bg); 
    font-family: 'Outfit', sans-serif; color: var(--text); 
    background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;
  }
  canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; z-index: 1; }
  h1, h2, h3 { font-family: 'Titan One', cursive; font-weight: normal; }

  /* ================= FLOATING LOG BUTTON ================= */
  #debug-trigger {
    position: fixed; bottom: 20px; left: 20px; z-index: 99998;
    background: var(--primary); color: #fff; border: var(--border);
    padding: 10px 20px; border-radius: 12px; font-weight: 900; font-size: 14px;
    box-shadow: var(--shadow-sm); cursor: pointer; font-family: 'Titan One';
    display: flex; align-items: center; gap: 8px; transition: 0.1s;
  }
  #debug-trigger:active { transform: translate(4px, 4px); box-shadow: none; }

  #debug-console {
    position: fixed; top: 10px; right: 10px; width: 320px; height: 250px;
    background: rgba(0, 0, 0, 0.95); border: 2px solid #00ff00; border-radius: 8px;
    z-index: 99999; display: none; flex-direction: column; resize: both; overflow: auto;
    font-family: monospace; font-size: 11px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #debug-console.active { display: flex; }
  .debug-header { display: flex; justify-content: space-between; padding: 5px; background: #111; color: #00ff00; position: sticky; top: 0; border-bottom: 1px solid #333; }
  .debug-btn { background: #333; color: #fff; border: none; padding: 4px 8px; cursor: pointer; font-size: 10px; border-radius: 4px; }
  .debug-btn:active { background: #555; }
  #debug-content { padding: 5px; color: #fff; word-wrap: break-word; white-space: pre-wrap; }
  .log-error { color: #ff5555; font-weight: bold; }

  /* Telas */
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .screen.active { display: flex; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes pop { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .panel { background: var(--panel); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; border: var(--border); box-shadow: var(--shadow); position: relative; max-height: 90vh; overflow-y: auto; }
  
  button { width: 100%; padding: 15px; border: var(--border); border-radius: 16px; font-weight: 900; font-size: 16px; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; color: var(--text); box-shadow: var(--shadow-sm); text-transform: uppercase; }
  button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px transparent; }
  button:disabled { opacity: 0.5; transform: none; box-shadow: var(--shadow-sm); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: var(--secondary); color: #fff; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-purple { background: var(--purple); color: #fff; }
  .btn-white { background: #fff; }

  .input-group { margin-bottom: 15px; }
  input, textarea { width: 100%; padding: 15px; background: #F4F4F4; border: var(--border); border-radius: 12px; font-size: 16px; font-weight: 700; color: var(--text); font-family: 'Outfit'; resize: none; }
  input:focus, textarea:focus { outline: none; background: #fff; border-color: var(--accent); }

  .avatar-container { display: flex; justify-content: center; margin-bottom: 15px; }
  .avatar-preview { width: 90px; height: 90px; border-radius: 50%; background: var(--accent); object-fit: cover; border: var(--border); box-shadow: var(--shadow-sm); }
  
  .user-banner { display: flex; align-items: center; gap: 15px; background: var(--accent); padding: 15px; border-radius: 16px; border: var(--border); margin-bottom: 20px; box-shadow: var(--shadow-sm); color: #fff; }
  .user-banner img { width: 60px; height: 60px; border-radius: 50%; border: var(--border); object-fit: cover; background: #fff; }
  .user-banner h3 { font-size: 20px; margin-bottom: 2px; text-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
  .user-banner span { font-size: 12px; font-weight: 900; background: #1a1a1a; color: #fff; padding: 4px 10px; border-radius: 12px; }

  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 15px; display: none; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 50; }
  #hud.active { display: flex; }
  .player-info { display: flex; align-items: center; gap: 10px; background: var(--panel); padding: 8px 15px; border-radius: 12px; border: var(--border); box-shadow: var(--shadow-sm); pointer-events: auto; cursor: pointer; }
  .player-info img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #1a1a1a; object-fit: cover; }
  .score { font-family: 'Titan One'; font-size: 28px; color: var(--primary); line-height: 1; }
  .opp-score { color: var(--secondary); }

  #powerups { position: fixed; bottom: 20px; right: 20px; display: none; justify-content: flex-end; gap: 10px; z-index: 50; } /* Movido pra direita pra não bater no LOG */
  #powerups.active { display: flex; }
  .powerup-btn { padding: 12px 18px; border-radius: 12px; background: var(--purple); border: var(--border); color: #fff; font-family: 'Titan One'; font-size: 14px; cursor: pointer; pointer-events: auto; box-shadow: var(--shadow-sm); }

  #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 400px; }
  .toast { background: var(--primary); color: #fff; padding: 12px; border-radius: 12px; border: var(--border); font-weight: 900; font-size: 14px; box-shadow: var(--shadow); text-align: center; }
  
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); z-index: 9999; transition: opacity 0.3s; }
  .spinner { width: 50px; height: 50px; border: 6px solid var(--primary); border-radius: 50%; border-top-color: transparent; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; font-weight: 900; border-bottom: 3px dashed #ddd; padding-bottom: 8px; }
  .lb-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 2px solid #eee; }
  .lb-rank { font-family: 'Titan One'; font-size: 20px; color: #888; width: 30px; }
  .lb-user { display: flex; align-items: center; gap: 10px; flex: 1; }
  .lb-user img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #111; }
  .lb-user span { font-weight: 900; font-size: 14px; }
  .lb-stats { text-align: right; font-size: 12px; font-weight: 700; }
  .lb-stats .wins { color: var(--green); }
  .lb-stats .pts { color: var(--accent); }

  #lobby-players { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
  .lobby-slot { width: 60px; height: 60px; border-radius: 50%; border: var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; background: #eee; }
  .lobby-slot.filled { background: var(--green); overflow: hidden; }
  .lobby-slot img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<!-- BOTÃO FLUTUANTE DE LOG -->
<button id="debug-trigger">🐞 LOG</button>

<!-- CONSOLE -->
<div id="debug-console">
  <div class="debug-header"><span>Logs</span><div><button class="debug-btn" id="btn-copy-log">Copiar</button><button class="debug-btn" id="btn-close-log">X</button></div></div>
  <div id="debug-content"></div>
</div>

<div id="toast-container"></div>
<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text" style="font-weight: 900; font-family: 'Titan One'; font-size: 20px; text-align: center; padding: 0 20px;">Iniciando 3D...</div>
</div>

<!-- TELAS -->
<div id="screen-auth" class="screen">
  <div class="panel">
    <h1 style="text-align: center; font-size: 32px; margin-bottom: 15px; color: var(--primary); text-shadow: 2px 2px 0px #1a1a1a;">CRIAR PERFIL</h1>
    <div class="avatar-container"><img id="login-avatar-preview" class="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Felix&backgroundColor=38B6FF" /></div>
    <div class="input-group"><input type="text" id="login-name" placeholder="Seu Nickname" maxlength="12" /></div>
    <div class="input-group"><input type="text" id="login-avatar-url" placeholder="URL da Foto (Opcional)" /></div>
    <div class="input-group"><input type="file" id="login-avatar-file" accept="image/*" style="padding: 10px; font-size: 13px; background: transparent; border: 2px dashed #ccc;" /></div>
    <div class="input-group"><textarea id="login-bio" placeholder="Sua Bio curta..." maxlength="40" rows="2"></textarea></div>
    <button id="btn-save-profile" class="btn-primary">SALVAR E JOGAR</button>
  </div>
</div>

<div id="screen-main" class="screen">
  <div class="panel">
    <div class="user-banner">
      <img id="menu-avatar" src="" />
      <div style="flex:1;"><h3 id="menu-name">Nick</h3><span id="menu-rank">INICIANTE</span></div>
      <button id="btn-logout" class="btn-white" style="width:auto; padding:8px 12px; margin:0; font-size:12px;">SAIR</button>
    </div>
    <button id="btn-ranked-1v1" class="btn-secondary">RANKEADO 1V1</button>
    <button id="btn-street" class="btn-primary">STREET MODE</button>
    <button id="btn-leaderboard" class="btn-purple">TOP GLOBAL</button>
    <button id="btn-bot" class="btn-accent" style="display:none; margin-top: 10px;">JOGAR OFFLINE VS BOT</button>
  </div>
</div>

<div id="screen-lobby" class="screen">
  <div class="panel">
    <h2 style="text-align: center; margin-bottom: 15px;">BUSCANDO...</h2>
    <div id="lobby-players"></div>
    <button id="btn-cancel-lobby" class="btn-white">CANCELAR</button>
  </div>
</div>

<div id="screen-leaderboard" class="screen">
  <div class="panel">
    <h2 style="text-align: center; margin-bottom: 20px; color: var(--purple);">TOP GLOBAL</h2>
    <div id="leaderboard-list" style="max-height: 300px; overflow-y: auto;"></div>
    <button id="btn-close-leaderboard" class="btn-white" style="margin-top: 15px;">VOLTAR</button>
  </div>
</div>

<div id="hud">
  <div class="player-info" id="hud-local"><img src="" id="hud-local-avatar" /><div><div style="font-size:12px; font-weight:900;" id="hud-local-name">Você</div><div class="score" id="hud-local-score">0</div></div></div>
  <div class="player-info" id="hud-opponent" style="flex-direction: row-reverse; text-align: right;"><img src="" id="hud-opp-avatar" /><div><div style="font-size:12px; font-weight:900;" id="hud-opp-name">Oponente</div><div class="score opp-score" id="hud-opp-score">0</div></div></div>
</div>

<div id="powerups">
  <div class="powerup-btn" id="pu-fast">TURBO</div>
  <div class="powerup-btn" id="pu-ghost">FANTASMA</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, set, get, push, onValue, update, remove, serverTimestamp } from 'firebase/database';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';

/* ================================================================== */
/*  SISTEMA DE LOGS E CONSOLE FLUTUANTE                               */
/* ================================================================== */
const el = id => document.getElementById(id);
const debugContent = el('debug-content');

// Abre e fecha com 1 clique
el('debug-trigger').addEventListener('click', () => {
  el('debug-console').classList.toggle('active');
});
el('btn-close-log').addEventListener('click', () => el('debug-console').classList.remove('active'));
el('btn-copy-log').addEventListener('click', () => navigator.clipboard.writeText(debugContent.innerText).then(() => alert('Logs copiados!')));

function logMsg(type, args) {
  try {
    const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
    const color = type === 'error' ? 'log-error' : '';
    if(debugContent) {
      debugContent.innerHTML += `<div class="${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      debugContent.scrollTop = debugContent.scrollHeight;
    }
  } catch(e) {}
  if(console[type]) console[type].apply(console, args);
}
const originalError = console.error;
console.log = (...a) => logMsg('log', a); 
console.error = (...a) => logMsg('error', a);
window.onerror = (m, s, l) => originalError("GLOBAL ERROR:", m, s, l);
window.onunhandledrejection = (e) => originalError("PROMISE ERROR:", e.reason);

/* ================================================================== */
/*  FIREBASE                                                          */
/* ================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBI1iUCJOtXjXwXEls8aUEycn7WCfVSJpM",
  authDomain: "ping-pong-street.firebaseapp.com",
  databaseURL: "https://ping-pong-street-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ping-pong-street",
  storageBucket: "ping-pong-street.firebasestorage.app",
  messagingSenderId: "1003659658117",
  appId: "1:1003659658117:web:e86e55c368808bfc387aec"
};

let app, db, auth, currentUser = null, userProfile = null, currentRoomId = null, isHost = false, isAuthReady = false;
let roomUnsub = null;
try { app = initializeApp(firebaseConfig); db = getDatabase(app); auth = getAuth(app); console.log("Firebase Iniciado."); } catch(e) { console.error("Firebase Init:", e); }

const showToast = (msg) => {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  el('toast-container').appendChild(t); setTimeout(() => t.remove(), 2500);
};
function getRankName(wins) { if (wins < 5) return 'INICIANTE'; if (wins < 15) return 'BRONZE'; if (wins < 30) return 'PRATA'; if (wins < 50) return 'OURO'; return 'RAQUETE DOURADA'; }

/* ================================================================== */
/*  FAILSAFE GLOBAL                                                   */
/* ================================================================== */
setTimeout(() => {
  const loading = el('loading');
  if (loading && loading.style.display !== 'none') {
    console.warn("Forçando fechamento do Loading por Timeout de 6s.");
    loading.style.display = 'none';
    if (!userProfile) showScreen('screen-auth');
    else showScreen('screen-main');
  }
}, 6000);

/* ================================================================== */
/*  3D SETUP                                                          */
/* ================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 15, 40);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 200);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
} catch(e) {
  console.error("WebGL não suportado:", e);
  el('loading-text').textContent = "Erro: Seu navegador não suporta 3D.";
}

const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0xD4C4A8 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(5, 10, 5); sun.castShadow = true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableRotate = false; controls.enablePan = false; controls.enableZoom = false;

let paddlePivot, oppPaddlePivot, ballMesh;
let tableSize = new THREE.Vector3(2, 0.1, 4);
let startPaddlePos = new THREE.Vector3(0, 0, 2.5);
let targetPaddlePos = new THREE.Vector3(0, 0, 2.5);
let isPlaying = false, isStreetMode = false, isBotMode = false;
let localScore = 0, oppScore = 0, ballRadius = 0.06;
let ballVelocity = new THREE.Vector3(), lastSyncTime = 0;
let puFast = false, puGhost = false;

const loader = new GLTFLoader();
const loadGLB = (url) => new Promise((res, rej) => {
  const timeout = setTimeout(() => rej(new Error("Timeout GLB (2.5s)")), 2500);
  loader.load(url, (gltf) => { clearTimeout(timeout); res(gltf); }, undefined, (err) => { clearTimeout(timeout); rej(err); });
});

async function init3D() {
  el('loading-text').textContent = "Carregando Mesa e Raquete...";
  console.log("Iniciando carregamento de modelos GLB...");
  try {
    const [tableGltf, paddleGltf] = await Promise.all([loadGLB('table.glb'), loadGLB('paddle.glb')]);
    const table = tableGltf.scene;
    table.traverse(o => { if(o.isMesh) { o.castShadow = true; o.receiveShadow = true; }});
    const box = new THREE.Box3().setFromObject(table);
    tableSize.copy(box.getSize(new THREE.Vector3()));
    table.position.y -= box.min.y; scene.add(table);
    
    const paddle = paddleGltf.scene;
    paddle.traverse(o => { if(o.isMesh) { o.castShadow = true; }});
    const pBox = new THREE.Box3().setFromObject(paddle);
    const scale = (tableSize.y * 0.4) / pBox.getSize(new THREE.Vector3()).y;
    paddle.scale.setScalar(scale); paddle.position.y -= pBox.min.y;
    
    paddlePivot = new THREE.Group(); paddlePivot.add(paddle); paddlePivot.position.copy(startPaddlePos); scene.add(paddlePivot);
    oppPaddlePivot = new THREE.Group(); oppPaddlePivot.add(paddle.clone()); oppPaddlePivot.position.set(0, 0, -2.5); oppPaddlePivot.rotation.y = Math.PI; scene.add(oppPaddlePivot);
    console.log("Modelos GLB carregados com sucesso.");
  } catch (e) {
    console.warn("Fallback para modelos 3D básicos. Motivo:", e.message);
    const tMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 4), new THREE.MeshStandardMaterial({color:0x5271FF}));
    tMesh.receiveShadow = true; tMesh.castShadow = true; scene.add(tMesh);
    paddlePivot = new THREE.Group(); paddlePivot.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.1), new THREE.MeshStandardMaterial({color:0xFF5757})));
    paddlePivot.position.copy(startPaddlePos); scene.add(paddlePivot);
    oppPaddlePivot = new THREE.Group(); oppPaddlePivot.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.1), new THREE.MeshStandardMaterial({color:0x00C878})));
    oppPaddlePivot.position.set(0, 0, -2.5); oppPaddlePivot.rotation.y = Math.PI; scene.add(oppPaddlePivot);
  }

  ballMesh = new THREE.Mesh(new THREE.SphereGeometry(ballRadius, 16, 16), new THREE.MeshStandardMaterial({ color: 0xFFFFFF }));
  ballMesh.castShadow = true; ballMesh.visible = false; scene.add(ballMesh);
  camera.position.set(0, 3, 6); controls.target.set(0, 0.5, 0); controls.update();
  
  el('loading').style.display = 'none';
  initFirebaseAuth();
}

/* ================================================================== */
/*  AUTH & PROFILE                                                    */
/* ================================================================== */
const screens = ['screen-auth', 'screen-main', 'screen-lobby', 'screen-leaderboard'];
function showScreen(id) { screens.forEach(s => { if(el(s)) el(s).classList.remove('active'); }); if(id && el(id)) el(id).classList.add('active'); }

async function initFirebaseAuth() {
  el('loading-text').textContent = "Conectando ao Firebase...";
  
  setTimeout(() => { if(!isAuthReady) { el('btn-bot').style.display = 'block'; el('loading').style.display = 'none'; showScreen('screen-main'); } }, 4000);

  onAuthStateChanged(auth, async (user) => {
    if(user) {
      currentUser = user; isAuthReady = true;
      const local = localStorage.getItem('pps_profile');
      if(local) { userProfile = JSON.parse(local); loadMainMenu(); }
      else {
        try {
          const snap = await get(ref(db, 'users/' + user.uid));
          if(snap.exists()) { userProfile = snap.val(); localStorage.setItem('pps_profile', JSON.stringify(userProfile)); loadMainMenu(); }
          else { showScreen('screen-auth'); el('loading').style.display = 'none'; }
        } catch(e) { showScreen('screen-auth'); el('loading').style.display = 'none'; }
      }
    } else {
      try { await signInAnonymously(auth); } catch(e) { console.error("Auth Anon Fail", e); }
    }
  });
}

el('login-avatar-file').addEventListener('change', (e) => {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = 128;
      canvas.getContext('2d').drawImage(img, 0, 0, 128, 128);
      const base64 = canvas.toDataURL('image/jpeg', 0.6);
      el('login-avatar-preview').src = base64; el('login-avatar-url').value = base64;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
el('login-avatar-url').addEventListener('input', (e) => el('login-avatar-preview').src = e.target.value || 'https://api.dicebear.com/7.x/bottts/svg?seed=Felix');

el('btn-save-profile').addEventListener('click', async () => {
  if(!isAuthReady || !currentUser) return showToast('Conectando... Aguarde.');
  const btn = el('btn-save-profile'); const name = el('login-name').value.trim();
  if(!name) return showToast('Coloque um nome!');
  btn.disabled = true; btn.textContent = 'SALVANDO...';
  userProfile = { name, avatar: el('login-avatar-url').value.trim() || `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`, bio: el('login-bio').value.trim(), wins: 0, losses: 0, points: 0 };
  
  try {
    await set(ref(db, 'users/' + currentUser.uid), userProfile);
    localStorage.setItem('pps_profile', JSON.stringify(userProfile));
    loadMainMenu();
  } catch(err) { showToast('Erro ao salvar. Veja console.'); btn.disabled = false; btn.textContent = 'SALVAR E JOGAR'; }
});

function loadMainMenu() {
  if(!userProfile) return;
  el('menu-avatar').src = userProfile.avatar; el('menu-name').textContent = userProfile.name; el('menu-rank').textContent = getRankName(userProfile.wins || 0);
  el('hud-local-avatar').src = userProfile.avatar; el('hud-local-name').textContent = userProfile.name;
  showScreen('screen-main'); el('loading').style.display = 'none';
}

el('btn-logout').addEventListener('click', () => { localStorage.removeItem('pps_profile'); location.reload(); });

/* ================================================================== */
/*  LEADERBOARD & MATCHMAKING                                         */
/* ================================================================== */
el('btn-leaderboard').addEventListener('click', async () => {
  showScreen('screen-leaderboard'); const list = el('leaderboard-list'); list.innerHTML = '<p style="text-align:center;">Carregando...</p>';
  try {
    const snap = await get(ref(db, 'users')); let users = [];
    if(snap.exists()) snap.forEach(c => users.push({ id: c.key, ...c.val() }));
    users.sort((a,b) => ((b.wins||0) - (a.wins||0)) || ((b.points||0) - (a.points||0)));
    list.innerHTML = users.slice(0,15).map((u,i) => `<div class="lb-item"><div class="lb-rank">#${i+1}</div><div class="lb-user"><img src="${u.avatar}"><span>${u.name}</span></div><div class="lb-stats"><span class="wins">${u.wins||0} V</span><br><span class="pts">${u.points||0} PTS</span></div></div>`).join('');
  } catch(e) { list.innerHTML = '<p style="text-align:center; color:red;">Erro.</p>'; }
});
el('btn-close-leaderboard').addEventListener('click', () => loadMainMenu());

async function findMatch(mode, maxPlayers) {
  showScreen('screen-lobby'); isStreetMode = (mode === 'street');
  try {
    const snap = await get(ref(db, 'rooms')); let found = null;
    if(snap.exists()) { const rooms = snap.val(); for(const k in rooms) { if(rooms[k].mode === mode && rooms[k].status === 'waiting' && Object.keys(rooms[k].players||{}).length < maxPlayers) { found = { id: k, ...rooms[k] }; break; } } }
    if(found) {
      currentRoomId = found.id; isHost = false; await update(ref(db, `rooms/${currentRoomId}/players`), { [currentUser.uid]: true });
      if(Object.keys(found.players).length + 1 >= maxPlayers) await update(ref(db, `rooms/${currentRoomId}`), { status: 'playing' });
      startGame();
    } else {
      const newRef = push(ref(db, 'rooms')); currentRoomId = newRef.key; isHost = true;
      await set(newRef, { host: currentUser.uid, mode, status: 'waiting', maxPlayers, createdAt: serverTimestamp(), players: { [currentUser.uid]: true } });
      if(roomUnsub) roomUnsub();
      roomUnsub = onValue(ref(db, `rooms/${currentRoomId}`), (s) => {
        if(!s.exists()) return; const room = s.val(); const pCount = Object.keys(room.players||{}).length;
        let html = ''; for(let i=0; i<maxPlayers; i++) html += `<div class="lobby-slot ${i<pCount?'filled':''}">${i<pCount?`<img src="${userProfile.avatar}">`:'?'}</div>`;
        el('lobby-players').innerHTML = html;
        if(pCount >= maxPlayers && room.status === 'playing') startGame();
      });
    }
  } catch(e) { showToast('Erro na busca.'); loadMainMenu(); }
}

el('btn-ranked-1v1').addEventListener('click', () => findMatch('ranked', 2));
el('btn-street').addEventListener('click', () => findMatch('street', 2));
el('btn-cancel-lobby').addEventListener('click', () => { if(roomUnsub) roomUnsub(); if(currentRoomId && isHost) remove(ref(db, `rooms/${currentRoomId}`)); currentRoomId = null; loadMainMenu(); });

el('btn-bot').addEventListener('click', () => {
  isBotMode = true; isPlaying = true; showScreen(null); el('hud').classList.add('active');
  el('hud-opp-name').textContent = 'Bot'; el('hud-opp-avatar').src = 'https://api.dicebear.com/7.x/bottts/svg?seed=Bot';
  resetBall();
});

/* ================================================================== */
/*  GAME LOGIC                                                        */
/* ================================================================== */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const camDir = new THREE.Vector3(), hitPoint = new THREE.Vector3(), dragStartHitPoint = new THREE.Vector3(), dragStartPaddlePos = new THREE.Vector3(), prevPaddlePos = new THREE.Vector3(), paddleVelocity = new THREE.Vector3();
let dragging = false;

async function startGame() {
  isPlaying = true; showScreen(null); el('hud').classList.add('active');
  if(isStreetMode) el('powerups').classList.add('active');
  
  const snap = await get(ref(db, `rooms/${currentRoomId}/players`));
  const oppUid = Object.keys(snap.val()).find(id => id !== currentUser.uid);
  if(oppUid) {
    const u = await get(ref(db, 'users/' + oppUid));
    if(u.exists()) { el('hud-opp-avatar').src = u.val().avatar; el('hud-opp-name').textContent = u.val().name; }
    onValue(ref(db, `matches/${currentRoomId}/paddles/${oppUid}`), s => { if(s.exists()) { const p = s.val(); oppPaddlePivot.position.set(p.x, p.y, p.z); oppPaddlePivot.rotation.set(p.rx||0, Math.PI, p.rz||0); } });
  }
  
  onValue(ref(db, `matches/${currentRoomId}/score`), s => { if(s.exists()) { el('hud-local-score').textContent = s[currentUser.uid]||0; el('hud-opp-score').textContent = s[oppUid]||0; } });
  if(!isHost) onValue(ref(db, `matches/${currentRoomId}/ball`), s => { if(s.exists()) { const b = s.val(); ballMesh.position.set(b.x,b.y,b.z); ballVelocity.set(b.vx,b.vy,b.vz); } });
  resetBall();
}

function resetBall() {
  if(!ballMesh) return; ballMesh.position.set(0, tableSize.y + 0.5, 0); ballVelocity.set(0, 0, (Math.random() > 0.5 ? 1 : -1) * 5); ballMesh.visible = true;
  puFast = false; puGhost = false; ballMesh.material.color.setHex(0xFFFFFF); ballMesh.material.transparent = false; ballMesh.material.opacity = 1;
  if(isHost || isBotMode) syncBall();
}

function updatePhysics(dt) {
  if(!isPlaying || (!isHost && !isBotMode) || !ballMesh.visible) return;

  ballVelocity.y += -9.8 * 0.6 * dt; if(puFast) ballVelocity.z *= 1.03;
  ballMesh.position.addScaledVector(ballVelocity, dt);

  if(ballMesh.position.y < ballRadius) { ballMesh.position.y = ballRadius; ballVelocity.y *= -0.75; }
  
  const overTable = Math.abs(ballMesh.position.x) < tableSize.x/2 && Math.abs(ballMesh.position.z) < tableSize.z/2;
  if(overTable && ballMesh.position.y - ballRadius < tableSize.y && ballVelocity.y < 0) {
    ballMesh.position.y = tableSize.y + ballRadius; ballVelocity.y = Math.abs(ballVelocity.y) * 0.85;
  }

  const prevPos = ballMesh.position.clone().sub(ballVelocity.clone().multiplyScalar(dt));
  const moveDir = ballMesh.position.clone().sub(prevPos); const dist = moveDir.length();
  if(dist > 0.001) {
    const ray = new THREE.Raycaster(prevPos, moveDir.normalize(), 0, dist + ballRadius);
    if(ray.intersectObject(paddlePivot, true).length > 0 && ballVelocity.z > 0) {
      ballVelocity.z = -Math.abs(ballVelocity.z) * 1.5; ballVelocity.y = Math.abs(ballVelocity.y) * 0.5 + 2.5; ballVelocity.x += paddleVelocity.x * 2.0;
    } else if(ray.intersectObject(oppPaddlePivot, true).length > 0 && ballVelocity.z < 0) {
      ballVelocity.z = Math.abs(ballVelocity.z) * 1.5; ballVelocity.y = Math.abs(ballVelocity.y) * 0.5 + 2.5;
    }
  }

  if(ballMesh.position.z > 3) { localScore++; if(!isBotMode) update(ref(db, `matches/${currentRoomId}/score`), { [currentUser.uid]: localScore }); resetBall(); }
  else if(ballMesh.position.z < -3) { resetBall(); }

  if((isHost || isBotMode) && Date.now() - lastSyncTime > 50) { syncBall(); lastSyncTime = Date.now(); }
}

function syncBall() { if(!isBotMode) update(ref(db, `matches/${currentRoomId}/ball`), { x: ballMesh.position.x, y: ballMesh.position.y, z: ballMesh.position.z, vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.z }); }

/* ================================================================== */
/*  CONTROLS & LOOP                                                   */
/* ================================================================== */
window.addEventListener('pointerdown', (e) => {
  if(!isPlaying || e.target.closest('.screen') || e.target.closest('.powerup-btn') || e.target.closest('#debug-trigger') || e.target.closest('#debug-console')) return;
  const r = renderer.domElement.getBoundingClientRect(); pointerNDC.x = ((e.clientX - r.left) / r.width) * 2 - 1; pointerNDC.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  if(raycaster.intersectObject(paddlePivot, true).length === 0) return;
  dragging = true; camera.getWorldDirection(camDir); dragPlane.setFromNormalAndCoplanarPoint(camDir, paddlePivot.position); dragStartPaddlePos.copy(paddlePivot.position);
  if(raycaster.ray.intersectPlane(dragPlane, hitPoint)) dragStartHitPoint.copy(hitPoint);
});
window.addEventListener('pointermove', (e) => {
  if(!dragging) return;
  const r = renderer.domElement.getBoundingClientRect(); pointerNDC.x = ((e.clientX - r.left) / r.width) * 2 - 1; pointerNDC.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  if(raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
    const d = new THREE.Vector3().subVectors(hitPoint, dragStartHitPoint);
    targetPaddlePos.set(THREE.MathUtils.clamp(dragStartPaddlePos.x + d.x * 1.5, -1.5, 1.5), THREE.MathUtils.clamp(dragStartPaddlePos.y + d.y * 1.5, 0, 2.5), THREE.MathUtils.clamp(dragStartPaddlePos.z + d.z * 1.5, 0.5, 3));
  }
});
window.addEventListener('pointerup', () => { if(dragging) { dragging = false; targetPaddlePos.copy(startPaddlePos); } });

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.05);
  if(isPlaying && paddlePivot) {
    paddleVelocity.subVectors(paddlePivot.position, prevPaddlePos).divideScalar(dt || 0.016); prevPaddlePos.copy(paddlePivot.position);
    paddlePivot.position.lerp(targetPaddlePos, 0.2); paddlePivot.rotation.y = (paddlePivot.position.x / 2) * -0.5;
    if(!isBotMode && Date.now() % 66 === 0) update(ref(db, `matches/${currentRoomId}/paddles/${currentUser.uid}`), { x: paddlePivot.position.x, y: paddlePivot.position.y, z: paddlePivot.position.z, rx: paddlePivot.rotation.x, rz: paddlePivot.rotation.z });
    if(isBotMode) {
      oppPaddlePivot.position.x += (ballMesh.position.x * 0.8 - oppPaddlePivot.position.x) * 0.05;
      oppPaddlePivot.position.y += (Math.max(0.5, ballMesh.position.y) - oppPaddlePivot.position.y) * 0.05;
    }
  }
  updatePhysics(dt); controls.update(); if(renderer) renderer.render(scene, camera);
}

init3D().catch(e => {
  console.error("Erro Fatal no init3D:", e);
  el('loading').style.display = 'none';
  showScreen('screen-auth');
});
animate();
</script>
</body>
