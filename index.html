<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ping Pong Street</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ========================================================
     VARIÁVEIS E RESET
     ======================================================== */
  :root {
    --bg-dark: #09090b;
    --neon-pink: #ff007f;
    --neon-cyan: #00f0ff;
    --neon-purple: #7000ff;
    --neon-yellow: #ffcc00;
    --panel-bg: rgba(20, 15, 30, 0.7);
    --panel-border: rgba(255, 0, 127, 0.3);
    --text-main: #ffffff;
    --text-dim: #b0b0c0;
  }
  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
  html, body { 
    height: 100%; overflow: hidden; background: var(--bg-dark); 
    font-family: 'Poppins', sans-serif; color: var(--text-main); 
  }
  canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; z-index: 1; }
  
  /* Fundo Animado */
  .bg-animated {
    position: fixed; inset: 0; z-index: 0;
    background: linear-gradient(45deg, #09090b, #1a0033, #0a1a2a, #09090b);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* SVG Icons */
  .icon { width: 20px; height: 20px; fill: currentColor; vertical-align: middle; }
  
  /* ========================================================
     TELAS E PAINÉIS
     ======================================================== */
  .screen { 
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; 
    z-index: 100; padding: 20px; 
  }
  .screen.active { display: flex; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  
  .panel { 
    background: var(--panel-bg); padding: 35px 25px; border-radius: 24px; width: 100%; max-width: 400px; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,0,127,0.05); 
    max-height: 90vh; overflow-y: auto; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid var(--panel-border); position: relative;
  }
  
  /* Títulos */
  .title-logo { 
    font-family: 'Orbitron', sans-serif; text-align: center; font-size: 28px; font-weight: 900; margin-bottom: 25px; 
    background: linear-gradient(to right, var(--neon-pink), var(--neon-cyan)); 
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    filter: drop-shadow(0 0 10px rgba(255,0,127,0.5)); letter-spacing: 2px;
  }
  h2 { font-family: 'Orbitron', sans-serif; text-align: center; font-size: 22px; margin-bottom: 20px; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,240,255,0.5); }

  /* ========================================================
     INPUTS COM EFEITO FLUTUANTE
     ======================================================== */
  .input-group { position: relative; margin-bottom: 20px; }
  .input-group .icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); fill: var(--neon-pink); transition: 0.3s; }
  input, textarea { 
    width: 100%; padding: 16px 16px 16px 45px; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); 
    color: #fff; border-radius: 12px; font-size: 15px; font-family: 'Poppins', sans-serif; transition: all 0.3s;
  }
  input:focus, textarea:focus { 
    outline: none; border-color: var(--neon-cyan); background: rgba(0,240,255,0.05); 
    box-shadow: 0 0 15px rgba(0,240,255,0.2); 
  }
  input:focus + .icon { fill: var(--neon-cyan); transform: translateY(-50%) scale(1.1); }
  
  /* ========================================================
     BOTÕES ANIMADOS
     ======================================================== */
  button { 
    width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; font-family: 'Orbitron', sans-serif;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; align-items: center; justify-content: center; gap: 10px; 
    margin-bottom: 15px; position: relative; overflow: hidden;
  }
  button::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s;
  }
  button:hover::after { left: 100%; }
  button:hover { transform: translateY(-3px) scale(1.02); }
  button:active { transform: translateY(1px) scale(0.98); }
  
  .btn-primary { 
    background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple)); color: #fff; 
    box-shadow: 0 5px 20px rgba(255,0,127,0.4); 
  }
  .btn-primary:hover { box-shadow: 0 8px 30px rgba(255,0,127,0.7); }
  
  .btn-secondary { 
    background: transparent; color: var(--neon-cyan); border: 2px solid var(--neon-cyan); 
    box-shadow: 0 0 10px rgba(0,240,255,0.1) inset;
  }
  .btn-secondary:hover { background: rgba(0,240,255,0.1); box-shadow: 0 0 20px rgba(0,240,255,0.4); }
  
  .btn-street { 
    background: linear-gradient(45deg, #00f0ff, #0055ff); color: #fff; 
    box-shadow: 0 5px 20px rgba(0,240,255,0.4);
  }
  .btn-street:hover { box-shadow: 0 8px 30px rgba(0,240,255,0.7); }

  /* ========================================================
     AVATARES
     ======================================================== */
  .avatar-container { display: flex; justify-content: center; margin-bottom: 20px; }
  .avatar-preview { 
    width: 100px; height: 100px; border-radius: 50%; background: #222; 
    object-fit: cover; border: 3px solid var(--neon-pink); box-shadow: 0 0 20px rgba(255,0,127,0.4);
    animation: pulseGlow 2.5s infinite alternate;
  }
  @keyframes pulseGlow {
    0% { box-shadow: 0 0 15px rgba(255,0,127,0.3); border-color: rgba(255,0,127,0.5); }
    100% { box-shadow: 0 0 30px rgba(255,0,127,0.8); border-color: rgba(255,0,127,1); }
  }

  /* ========================================================
     HUD E JOGO
     ======================================================== */
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 20px; display: none; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 50; }
  #hud.active { display: flex; animation: slideDown 0.5s; }
  @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  
  .player-info { 
    display: flex; align-items: center; gap: 15px; background: rgba(10, 5, 20, 0.8); padding: 10px 20px; 
    border-radius: 30px; pointer-events: auto; cursor: pointer; border: 1px solid var(--neon-cyan); 
    box-shadow: 0 0 15px rgba(0,240,255,0.2); transition: 0.3s; backdrop-filter: blur(10px);
  }
  .player-info:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,240,255,0.5); }
  .player-info img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--neon-pink); }
  .score { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900; color: var(--neon-pink); line-height: 1; text-shadow: 0 0 10px var(--neon-pink); }
  .opp-score { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

  /* ========================================================
     POWER-UPS
     ======================================================== */
  #powerups { position: fixed; bottom: 30px; left: 0; right: 0; display: none; justify-content: center; gap: 20px; z-index: 50; }
  #powerups.active { display: flex; animation: slideUp 0.5s; }
  .powerup-btn { 
    padding: 12px 25px; border-radius: 30px; background: rgba(112, 0, 255, 0.8); border: 2px solid var(--neon-cyan); 
    color: #fff; font-weight: 700; cursor: pointer; pointer-events: auto; backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0,240,255,0.4); transition: 0.2s; display: flex; align-items: center; gap: 8px;
    font-family: 'Orbitron', sans-serif; font-size: 14px;
  }
  .powerup-btn:hover { transform: translateY(-5px) scale(1.1); background: var(--neon-purple); box-shadow: 0 0 30px rgba(0,240,255,0.8); }

  /* ========================================================
     TOASTS (Notificações) e LOADING
     ======================================================== */
  #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { 
    background: linear-gradient(45deg, #ff007f, #7000ff); color: #fff; padding: 15px 30px; border-radius: 50px; 
    font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3);
    animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-align: center;
  }
  @keyframes toastIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .toast.hide { animation: toastOut 0.3s forwards; }
  @keyframes toastOut { to { transform: translateY(-20px); opacity: 0; } }

  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-dark); z-index: 9999; }
  .spinner { width: 60px; height: 60px; border: 5px solid rgba(255,0,127,0.2); border-top-color: var(--neon-pink); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; box-shadow: 0 0 20px rgba(255,0,127,0.5); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal Perfil */
  .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; color: var(--text-dim); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;}
  .stat-value { color: var(--neon-cyan); font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 18px; }
  
  #lobby-players { display: flex; justify-content: center; gap: 30px; margin: 30px 0; }
  .lobby-slot { width: 80px; height: 80px; border-radius: 50%; border: 3px dashed rgba(255,0,127,0.4); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 30px; font-family: 'Orbitron'; }
  .lobby-slot.filled { border: 3px solid var(--neon-cyan); overflow: hidden; box-shadow: 0 0 20px var(--neon-cyan); animation: pulseGlow 1.5s infinite alternate;}
  .lobby-slot img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>

<div id="toast-container"></div>

<div id="loading">
  <div class="spinner"></div>
</div>

<!-- TELA 0: AUTENTICAÇÃO -->
<div id="screen-auth" class="screen">
  <div class="panel">
    <h2 class="title-logo">PING PONG STREET</h2>
    
    <div class="input-group">
      <input type="email" id="auth-email" placeholder="E-mail" />
      <svg class="icon"><use href="#i-email"></use></svg>
    </div>
    <div class="input-group">
      <input type="password" id="auth-pass" placeholder="Senha (mín. 6 caracteres)" />
      <svg class="icon"><use href="#i-lock"></use></svg>
    </div>
    
    <button id="btn-login" class="btn-primary" style="margin-top: 10px;">
      <svg class="icon"><use href="#i-login"></use></svg> ENTRAR
    </button>
    <button id="btn-register" class="btn-secondary">
      <svg class="icon"><use href="#i-user-plus"></use></svg> CRIAR CONTA
    </button>
    
    <div style="text-align:center; margin: 20px 0; color:var(--text-dim); font-size:12px; letter-spacing:2px;">OU</div>
    
    <button id="btn-guest" class="btn-street">
      <svg class="icon"><use href="#i-ghost"></use></svg> JOGAR COMO CONVIDADO
    </button>
  </div>
</div>

<!-- TELA 1: CRIAR PERFIL -->
<div id="screen-login" class="screen">
  <div class="panel">
    <h2>CRIAR PERFIL</h2>
    <div class="avatar-container">
      <img id="login-avatar-preview" class="avatar-preview" src="https://via.placeholder.com/100/1a0033/ff007f?text=?" />
    </div>
    
    <div class="input-group">
      <input type="text" id="login-name" placeholder="Seu Nickname" maxlength="15" />
      <svg class="icon"><use href="#i-user-plus"></use></svg>
    </div>
    
    <div class="input-group">
      <input type="text" id="login-avatar-url" placeholder="URL da Foto/GIF (Opcional)" />
      <svg class="icon"><use href="#i-image"></use></svg>
    </div>
    
    <input type="file" id="login-avatar-file" accept="image/*" style="padding: 12px; font-size: 13px; background: transparent; border: 2px dashed rgba(255,0,127,0.5); color: var(--text-dim); margin-bottom: 20px;" />
    
    <div class="input-group">
      <textarea id="login-bio" placeholder="Sua Bio curta..." maxlength="50" rows="2" style="padding-left: 15px;"></textarea>
    </div>
    
    <button id="btn-save-profile" class="btn-primary">SALVAR E JOGAR</button>
  </div>
</div>

<!-- TELA 2: MENU PRINCIPAL -->
<div id="screen-main" class="screen">
  <div class="panel">
    <div style="display:flex; align-items:center; gap:15px; margin-bottom: 30px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 20px; border: 1px solid rgba(255,0,127,0.2);">
      <img id="menu-avatar" class="avatar-preview" style="margin:0; width:70px; height:70px;" src="" />
      <div style="flex:1;">
        <h3 style="margin:0; font-family:'Orbitron'; font-size: 18px;" id="menu-name">Nick</h3>
        <span style="font-size:12px; color:var(--neon-cyan); font-weight: 700; letter-spacing: 1px;" id="menu-rank">INICIANTE</span>
      </div>
      <button id="btn-logout" class="btn-secondary" style="width:auto; padding:12px; margin:0; border-color: var(--neon-pink); color: var(--neon-pink);">
        <svg class="icon"><use href="#i-logout"></use></svg>
      </button>
    </div>
    
    <button id="btn-ranked" class="btn-primary">
      <svg class="icon"><use href="#i-trophy"></use></svg> RANKEADO (1v1)
    </button>
    <button id="btn-street" class="btn-street">
      <svg class="icon"><use href="#i-bolt"></use></svg> STREET MODE
    </button>
    <button id="btn-private" class="btn-secondary">
      <svg class="icon"><use href="#i-lock-closed"></use></svg> SALA PRIVADA
    </button>
  </div>
</div>

<!-- TELA 3: LOBBY -->
<div id="screen-lobby" class="screen">
  <div class="panel">
    <h2>BUSCANDO OPONENTE</h2>
    <p id="lobby-status" style="text-align:center; font-size:14px; color:var(--neon-cyan); animation: pulseGlow 1s infinite alternate;">Procurando jogadores...</p>
    
    <div id="lobby-players">
      <div class="lobby-slot">?</div>
      <div class="lobby-slot">?</div>
    </div>

    <img src="" id="hud-local-avatar" />
    <div>
      <div style="font-size:12px; color:var(--text-dim); font-weight:bold;" id="hud-local-name">Você</div>

    <div>

  </div>

<!-- MODAL DE PERFIL -->
<div id="modal-profile" class="screen" style="background: rgba(0,0,0,0.85); z-index:200;">

    <img id="prof-avatar" class="avatar-preview" style="width:120px; height:120px;" src="" />
    <h3 style="margin:0; font-family:'Orbitron'; font-size: 24px;" id="prof-name">Nome</h3>
    <p style="font-size:14px; color:var(--neon-pink); font-weight:bold; margin-bottom: 15px; letter-spacing:1px;" id="prof-rank">Rank</p>
    <p style="font-size:14px; font-style:italic; color:var(--text-dim); margin-bottom: 25px;" id="prof-bio">"Bio"</p>
    
    <div style="background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 1px solid rgba(0,240,255,0.2); margin-bottom: 25px;">
      <div class="stat-row"><span>VITÓRIAS</span> <span class="stat-value" id="prof-wins">0</span></div>
      <div class="stat-row" style="border:none; margin-bottom:0;"><span>DERROTAS</span> <span class="stat-value" id="prof-losses" style="color:var(--neon-pink);">0</span></div>
    </div>
    
    <button id="btn-close-profile" class="btn-secondary">FECHAR</button>
  </div>
</div>

<script type="module">

/* ================================================================== */

function showToast(message) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add('hide');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

let audioCtx = null;
let soundBuffer = null;
fetch('som.mp3')
  .then(res => res.arrayBuffer())
  .then(data => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.decodeAudioData(data, (buffer) => {
      audioCtx = ctx;
      soundBuffer = buffer;
    });
  }).catch(e => console.warn('Sem som.mp3'));

function playHitSound(intensity) {
  if (!audioCtx || !soundBuffer) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const source = audioCtx.createBufferSource();
  source.buffer = soundBuffer;
  source.playbackRate.value = Math.max(0.5, Math.min(2.0, 0.8 + (intensity * 0.4)));
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = Math.max(0.1, Math.min(1.0, intensity));
  source.connect(gainNode).connect(audioCtx.destination);
  source.start(0);
}

function makeWoodTexture(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const planks = 8;
  const ph = size / planks;
  for (let i = 0; i < planks; i++) {
    const light = 32 + Math.random() * 12;
    ctx.fillStyle = `hsl(28, 52%, ${light}%)`;
    ctx.fillRect(0, i * ph, size, ph);
    for (let g = 0; g < 55; g++) {
      const y0 = i * ph + Math.random() * ph;
      ctx.beginPath();
      ctx.moveTo(0, y0);
      for (let x = 0; x <= size; x += 16) ctx.lineTo(x, y0 + Math.sin(x * 0.02 + g) * 2.2 + (Math.random() - 0.5) * 3);
      ctx.strokeStyle = `hsla(28, 60%, ${light - 13}%, ${0.05 + Math.random() * 0.14})`;
      ctx.lineWidth = 0.5 + Math.random() * 1.6;
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, i * ph, size, 2);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(16, 16);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ================================================================== */
/*  CENA 3D                                                           */
/* ================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09090b);
scene.fog = new THREE.Fog(0x09090b, 16, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.75 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3a2a1a, 0.6));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.4);
sun.position.set(5, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5; sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
scene.add(sun);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableRotate = false; controls.enablePan = false; controls.enableZoom = false; controls.enableDamping = false;

let paddlePivot = null, oppPaddlePivot = null, ballMesh = null;
let tableSize = new THREE.Vector3(2, 0.1, 4);
let startPaddlePos = new THREE.Vector3(0, 0, 2.5);
let targetPaddlePos = new THREE.Vector3(0, 0, 2.5);

let isPlaying = false;
let isStreetMode = false;
let localScore = 0, oppScore = 0;
const ballRadius = 0.04;
let ballVelocity = new THREE.Vector3();
let lastBallSyncTime = 0;
let puFast = false, puCurve = false, puGhost = false;

const loader = new GLTFLoader();
const loadGLB = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

async function loadModels() {
  const [tableGltf, paddleGltf] = await Promise.all([
    loadGLB('table.glb').catch(() => null), loadGLB('paddle.glb').catch(() => null)
  ]);
  
  if (tableGltf) {
    const table = tableGltf.scene;
    table.traverse(o => { if(o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(table);
    tableSize.copy(box.getSize(new THREE.Vector3()));
    table.position.y -= box.min.y;
    table.position.z = 0;
    scene.add(table);
  }
  
  if (paddleGltf) {
    const paddle = paddleGltf.scene;
    paddle.traverse(o => { if(o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(paddle);
    const scale = (tableSize.y * 0.45) / box.getSize(new THREE.Vector3()).y;
    paddle.scale.setScalar(scale);
    const scaledBox = new THREE.Box3().setFromObject(paddle);
    paddle.position.y -= scaledBox.min.y;
    
    paddlePivot = new THREE.Group();
    paddlePivot.add(paddle);
    paddlePivot.position.copy(startPaddlePos);
    paddlePivot.rotation.x = -0.15;
    scene.add(paddlePivot);

    const oppPaddle = paddle.clone();
    oppPaddlePivot = new THREE.Group();
    oppPaddlePivot.add(oppPaddle);
    oppPaddlePivot.position.set(0, 0, -2.5);
    oppPaddlePivot.rotation.x = 0.15;
    oppPaddlePivot.rotation.y = Math.PI;
    scene.add(oppPaddlePivot);
  }
  
  ballMesh = new THREE.Mesh(new THREE.SphereGeometry(ballRadius, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff007f, emissive: 0x220011 }));
  ballMesh.castShadow = true;
  ballMesh.visible = false;
  scene.add(ballMesh);

  camera.position.set(0, 2.5, 6);
  controls.target.set(0, 0.5, 0);
  controls.update();
}

/*  UI E AUTENTICAÇÃO                                                 */

const el = id => document.getElementById(id);
const screens = ['screen-auth', 'screen-login', 'screen-main', 'screen-lobby'];
function showScreen(id) {
  screens.forEach(s => el(s).classList.remove('active'));
  if(id) el(id).classList.add('active');
}

el('login-avatar-file').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 128, 128);
      const base64 = canvas.toDataURL('image/jpeg', 0.6);
      el('login-avatar-preview').src = base64;
      el('login-avatar-url').value = base64;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

el('login-avatar-url').addEventListener('input', (e) => {
  el('login-avatar-preview').src = e.target.value || 'https://via.placeholder.com/100/1a0033/ff007f?text=?';
});

function getRankName(wins) {
  if (wins < 5) return 'Iniciante';
  if (wins < 15) return 'Bronze';
  if (wins < 30) return 'Prata';
  if (wins < 50) return 'Ouro';
  return 'Raquete Dourada';
}

el('btn-save-profile').addEventListener('click', async () => {
  const name = el('login-name').value.trim();
  const avatar = el('login-avatar-url').value.trim();
  const bio = el('login-bio').value.trim();
  if(!name) return showToast('Coloque um nome!');
  
  el('loading').style.display = 'flex';
  try {
    await set(ref(db, 'users/' + currentUser.uid), {
      name, avatar: avatar || 'https://via.placeholder.com/100/1a0033/ff007f?text=?', bio: bio || '',
      wins: 0, losses: 0, rank: 'Iniciante'
    });
    loadMainMenu();
  } catch (err) {
    showToast('Erro ao salvar perfil.');
    el('loading').style.display = 'none';
  }
});

function loadMainMenu() {
  get(ref(db, 'users/' + currentUser.uid)).then(snap => {
    if(!snap.exists()) { showScreen('screen-login'); return; }
    userProfile = snap.val();
    userProfile.rank = getRankName(userProfile.wins);
    
    el('menu-avatar').src = userProfile.avatar;
    el('menu-name').textContent = userProfile.name;
    el('menu-rank').textContent = userProfile.rank.toUpperCase();
    
    el('hud-local-avatar').src = userProfile.avatar;
    el('hud-local-name').textContent = userProfile.name;
    
    el('loading').style.display = 'none';
    showScreen('screen-main');
  }).catch(err => {
    showToast('Erro de conexão.');
    el('loading').style.display = 'none';
  });
}

async function handleAuth(action, email, pass) {
  email = email.trim();
  if (action !== 'guest' && (!email || !email.includes('@'))) {
    return showToast('E-mail inválido. Verifique o formato.');
  }
  if (action !== 'guest' && pass.length < 6) {
    return showToast('A senha precisa ter no mínimo 6 caracteres.');
  }

  el('loading').style.display = 'flex';
  
  try {
    if(action === 'login') await signInWithEmailAndPassword(auth, email, pass);
    if(action === 'register') await createUserWithEmailAndPassword(auth, email, pass);
    if(action === 'guest') await signInAnonymously(auth);
  } catch (error) {
    el('loading').style.display = 'none';
    let msg = error.message;
    if(error.code === 'auth/operation-not-allowed') msg = 'Método desativado no Firebase.';
    if(error.code === 'auth/email-already-in-use') msg = 'Este e-mail já está em uso.';
    if(error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') msg = 'E-mail ou senha incorretos.';
    if(error.code === 'auth/invalid-email') msg = 'Formato de e-mail inválido.';
    showToast(msg);
  }
}

el('btn-login').addEventListener('click', () => handleAuth('login', el('auth-email').value, el('auth-pass').value));
el('btn-register').addEventListener('click', () => handleAuth('register', el('auth-email').value, el('auth-pass').value));
el('btn-guest').addEventListener('click', () => handleAuth('guest'));

function openProfile(uid) {
  get(ref(db, 'users/' + uid)).then(snap => {
    if(!snap.exists()) return;
    const p = snap.val();
    el('prof-avatar').src = p.avatar;
    el('prof-name').textContent = p.name;
    el('prof-rank').textContent = getRankName(p.wins).toUpperCase();
    el('prof-bio').textContent = p.bio ? `"${p.bio}"` : '';
    el('prof-wins').textContent = p.wins;
    el('prof-losses').textContent = p.losses;
    el('modal-profile').classList.add('active');
  });
}

el('hud-opponent').addEventListener('click', () => {
  if(currentRoomId) {
    get(ref(db, `rooms/${currentRoomId}/players`)).then(snap => {
      if(!snap.exists()) return;
      const players = Object.keys(snap.val());
      const oppUid = players.find(id => id !== currentUser.uid);
      if(oppUid) openProfile(oppUid);
    });
  }
});

/* ================================================================== */
/*  MATCHMAKING E SALAS                                              */
/* ================================================================== */
async function findMatch(mode) {
  showScreen('screen-lobby');
  isStreetMode = (mode === 'street');
  
  try {
    const roomsRef = ref(db, 'rooms');
    const snapshot = await get(roomsRef);
    let foundRoom = null;
    
    if(snapshot.exists()) {
      const rooms = snapshot.val();
      for(const key in rooms) {
        if(rooms[key].mode === mode && rooms[key].status === 'waiting') {
          foundRoom = { id: key, ...rooms[key] };
          break;
        }
      }
    }

    if(foundRoom) {
      currentRoomId = foundRoom.id;
      isHost = false;
      await update(ref(db, `rooms/${currentRoomId}/players`), { [currentUser.uid]: true });
      await update(ref(db, `rooms/${currentRoomId}`), { status: 'playing' });
      startGame();
    } else {
      const newRoomRef = push(ref(db, 'rooms'));
      currentRoomId = newRoomRef.key;
      isHost = true;
      
      await set(newRoomRef, {
        host: currentUser.uid,
        mode: mode,
        status: 'waiting',
        createdAt: serverTimestamp(),
        players: { [currentUser.uid]: true }
      });

      onValue(ref(db, `rooms/${currentRoomId}`), (snap) => {
        if(!snap.exists()) return;
        const room = snap.val();
        const pCount = Object.keys(room.players || {}).length;
        
        let html = `<div class="lobby-slot filled"><img src="${userProfile.avatar}"></div>`;
        if(pCount < 2) html += `<div class="lobby-slot">?</div>`;
        
        el('lobby-players').innerHTML = html;

        if(pCount >= 2 && room.status === 'playing') {
          startGame();
        }
      });
    }
  } catch (e) {
    showToast('Erro ao buscar partida.');
    loadMainMenu();
  }
}

el('btn-ranked').addEventListener('click', () => findMatch('ranked'));
el('btn-street').addEventListener('click', () => findMatch('street'));
el('btn-cancel-lobby').addEventListener('click', () => {
  if(currentRoomId && isHost) remove(ref(db, `rooms/${currentRoomId}`));
  currentRoomId = null;
  loadMainMenu();
});

/* ================================================================== */
/*  LÓGICA DE JOGO E SINCRONIZAÇÃO                                    */
/* ================================================================== */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const camDir = new THREE.Vector3();
const hitPoint = new THREE.Vector3();
const dragStartHitPoint = new THREE.Vector3();
const dragStartPaddlePos = new THREE.Vector3();
const prevPaddlePos = new THREE.Vector3();
const paddleVelocity = new THREE.Vector3();

let dragging = false;

async function startGame() {
  isPlaying = true;
  showScreen(null);
  el('hud').classList.add('active');
  if(isStreetMode) el('powerups').classList.add('active');
  
  const snap = await get(ref(db, `rooms/${currentRoomId}/players`));
  const players = Object.keys(snap.val());
  const oppUid = players.find(id => id !== currentUser.uid);
  
  if(oppUid) {
    const oppSnap = await get(ref(db, 'users/' + oppUid));
    if(oppSnap.exists()) {
       el('hud-opp-avatar').src = oppSnap.val().avatar;
       el('hud-opp-name').textContent = oppSnap.val().name;
    }
  }

  localScore = 0; oppScore = 0;
  el('hud-local-score').textContent = 0; el('hud-opp-score').textContent = 0;
  resetBall();
  
  onValue(ref(db, `matches/${currentRoomId}/score`), snap => {
    if(snap.exists()) {
      const s = snap.val();
      el('hud-local-score').textContent = s[currentUser.uid] || 0;
      el('hud-opp-score').textContent = s[oppUid] || 0;
    }
  });

  onValue(ref(db, `matches/${currentRoomId}/paddles/${oppUid}`), snap => {
    if(snap.exists() && oppPaddlePivot) {
      const p = snap.val();
      oppPaddlePivot.position.set(p.x, p.y, p.z);
      oppPaddlePivot.rotation.set(p.rx || 0, Math.PI, p.rz || 0);
    }
  });

  if(!isHost) {
    onValue(ref(db, `matches/${currentRoomId}/ball`), snap => {
      if(snap.exists() && ballMesh) {
        const b = snap.val();
        ballMesh.position.set(b.x, b.y, b.z);
        ballVelocity.set(b.vx, b.vy, b.vz);
        ballMesh.visible = b.visible !== false;
      }
    });
  }
}

function resetBall() {
  if(!ballMesh) return;
  if(isHost) {
    ballMesh.position.set(0, tableSize.y + 0.5, 0);
    ballVelocity.set(0, 0, (Math.random() > 0.5 ? 1 : -1) * 5);
    ballMesh.visible = true;
    puFast = false; puCurve = false; puGhost = false;
    ballMesh.material.color.setHex(0xff007f);
    ballMesh.material.transparent = false;
    ballMesh.material.opacity = 1;
  }
}

function updatePhysics(dt) {
  if(!isPlaying || !isHost || !ballMesh || !ballMesh.visible) return;

  ballVelocity.y += -9.8 * 0.6 * dt;

  if(puCurve) ballVelocity.x += Math.sin(Date.now() * 0.005) * 10 * dt;
  if(puFast) ballVelocity.z *= 1.02;
  
  ballMesh.position.addScaledVector(ballVelocity, dt);

  if(ballMesh.position.y < ballRadius) {
    ballMesh.position.y = ballRadius;
    ballVelocity.y *= -0.75;
  }

  const overTable = Math.abs(ballMesh.position.x) < tableSize.x/2 && Math.abs(ballMesh.position.z) < tableSize.z/2;
  if(overTable && ballMesh.position.y - ballRadius < tableSize.y) {
    if(ballVelocity.y < 0) {
      ballMesh.position.y = tableSize.y + ballRadius;
      ballVelocity.y = Math.abs(ballVelocity.y) * 0.85;
      playHitSound(0.4);
    }
  }

  const prevPos = ballMesh.position.clone().sub(ballVelocity.clone().multiplyScalar(dt));
  const moveDir = ballMesh.position.clone().sub(prevPos);
  const dist = moveDir.length();
  
  if(dist > 0.001) {
    const ray = new THREE.Raycaster(prevPos, moveDir.normalize(), 0, dist + ballRadius);
    
    if(ray.intersectObject(paddlePivot, true).length > 0 && ballVelocity.z > 0) {
      ballVelocity.z = -Math.abs(ballVelocity.z) * 1.5;
      ballVelocity.y = Math.abs(ballVelocity.y) * 0.5 + 2.5;
      ballVelocity.x += paddleVelocity.x * 2.0;
      playHitSound(1.0);
      syncBallToDB();
    }
    else if(ray.intersectObject(oppPaddlePivot, true).length > 0 && ballVelocity.z < 0) {
      ballVelocity.z = Math.abs(ballVelocity.z) * 1.5;
      ballVelocity.y = Math.abs(ballVelocity.y) * 0.5 + 2.5;
      playHitSound(1.0);
      syncBallToDB();
    }
  }

  if(ballMesh.position.z > 3) {
    localScore++;
    update(ref(db, `matches/${currentRoomId}/score`), { [currentUser.uid]: localScore });
    resetBall();
  } else if(ballMesh.position.z < -3) {
    resetBall();
  }

  if(Date.now() - lastBallSyncTime > 50) {
    syncBallToDB();
    lastBallSyncTime = Date.now();
  }
}

function syncBallToDB() {
  update(ref(db, `matches/${currentRoomId}/ball`), {
    x: ballMesh.position.x, y: ballMesh.position.y, z: ballMesh.position.z,
    vx: ballVelocity.x, vy: ballVelocity.y, vz: ballVelocity.z,
    visible: ballMesh.visible
  });
}

/* ================================================================== */
/*  CONTROLES                                                         */
/* ================================================================== */
const canvas = renderer.domElement;
function updatePointerNDC(e) {
  const rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

window.addEventListener('pointerdown', (e) => {
  if(!isPlaying || e.target.closest('.screen') || e.target.closest('.powerup-btn')) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;

  updatePointerNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);
  if(raycaster.intersectObject(paddlePivot, true).length === 0) return;

  dragging = true;
  camera.getWorldDirection(camDir);
  dragPlane.setFromNormalAndCoplanarPoint(camDir, paddlePivot.position);
  dragStartPaddlePos.copy(paddlePivot.position);
  
  if(raycaster.ray.intersectPlane(dragPlane, hitPoint)) dragStartHitPoint.copy(hitPoint);
});

window.addEventListener('pointermove', (e) => {
  if(!dragging) return;
  updatePointerNDC(e);
  raycaster.setFromCamera(pointerNDC, camera);
  if(raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
    const dragVec = new THREE.Vector3().subVectors(hitPoint, dragStartHitPoint);
    let nx = dragStartPaddlePos.x + dragVec.x * 1.5;
    let ny = dragStartPaddlePos.y + dragVec.y * 1.5;
    let nz = dragStartPaddlePos.z + dragVec.z * 1.5;

    nx = THREE.MathUtils.clamp(nx, -tableSize.x/2 - 0.5, tableSize.x/2 + 0.5);
    ny = THREE.MathUtils.clamp(ny, 0, 3);
    nz = THREE.MathUtils.clamp(nz, 0.2, 3);

    targetPaddlePos.set(nx, ny, nz);
  }
});

window.addEventListener('pointerup', () => {
  if(dragging) {
    dragging = false;
    targetPaddlePos.copy(startPaddlePos);
  }
});

el('pu-fast').addEventListener('click', () => {
  if(!isStreetMode || !isPlaying) return;
  puFast = true;
  ballMesh.material.color.setHex(0xff0000);
  el('pu-fast').style.display = 'none';
});
el('pu-curve').addEventListener('click', () => {
  if(!isStreetMode || !isPlaying) return;
  puCurve = true;
  el('pu-curve').style.display = 'none';
});
el('pu-ghost').addEventListener('click', () => {
  if(!isStreetMode || !isPlaying) return;
  puGhost = true;
  ballMesh.material.transparent = true;
  ballMesh.material.opacity = 0.2;
  el('pu-ghost').style.display = 'none';
});

/* ================================================================== */
/*  LOOP PRINCIPAL                                                    */
/* ================================================================== */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(isPlaying && paddlePivot) {
    paddleVelocity.subVectors(paddlePivot.position, prevPaddlePos).divideScalar(dt || 0.016);
    prevPaddlePos.copy(paddlePivot.position);

    paddlePivot.position.lerp(targetPaddlePos, 0.2);
    paddlePivot.rotation.y = (paddlePivot.position.x / 3) * -0.5;
    
    if(Date.now() % 5 === 0) {
      update(ref(db, `matches/${currentRoomId}/paddles/${currentUser.uid}`), {
        x: paddlePivot.position.x, y: paddlePivot.position.y, z: paddlePivot.position.z,
        rx: paddlePivot.rotation.x, rz: paddlePivot.rotation.z
      });
    }
  }

  updatePhysics(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* ================================================================== */
/*  INICIALIZAÇÃO                                                     */
/* ================================================================== */
async function init() {
  await loadModels();
  animate(); 
  
  if(!auth) {
    el('loading').style.display = 'none';
    showToast('Erro no Firebase. Verifique suas chaves.');
    return;
  }

  onAuthStateChanged(auth, async (user) => {
    if(user) {
      currentUser = user;
      const snap = await get(ref(db, 'users/' + user.uid)).catch(e => null);
      
      if(snap && snap.exists()) {
        loadMainMenu();
      } else {
        el('loading').style.display = 'none';
        showScreen('screen-login'); 
      }
    } else {
      el('loading').style.display = 'none';
      showScreen('screen-auth');
    }
  });
}

init();
</script>
